<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>عضویت | فانوس</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../assests/css/style.css">

</head>

<body class="auth-page">

<header id="navbar"></header>


<main class="auth-section">

    <div class="container">

        <div class="auth-wrapper">


            <div class="auth-content">

                <div class="auth-logo">
                    ف
                </div>

                <span class="section-eyebrow">
                    به فانوس بپیوندید
                </span>

                <h1>
                    ایجاد حساب کاربری
                </h1>

                <p>
                    حساب خود را بسازید و از امکانات فانوس استفاده کنید.
                </p>


                <form class="auth-form">


                    <div class="row g-3">


                        <div class="col-md-6">

                            <label for="firstName">
                                نام
                            </label>

                            <input
                                type="text"
                                id="firstName"
                                placeholder="نام"
                                required
                            >

                        </div>


                        <div class="col-md-6">

                            <label for="lastName">
                                نام خانوادگی
                            </label>

                            <input
                                type="text"
                                id="lastName"
                                placeholder="نام خانوادگی"
                                required
                            >

                        </div>


                        <div class="col-12">

                            <label for="registerEmail">
                                ایمیل
                            </label>

                            <input
                                type="email"
                                id="registerEmail"
                                placeholder="example@email.com"
                                required
                            >

                        </div>


                        <div class="col-12">

                            <label for="registerPassword">
                                رمز عبور
                            </label>

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="رمز عبور"
                                required
                            >

                        </div>


                        <div class="col-12">

                            <label for="confirmPassword">
                                تکرار رمز عبور
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="تکرار رمز عبور"
                                required
                            >

                        </div>


                        <div class="col-12">

                            <label class="terms-check">

                                <input type="checkbox" required>

                                <span>
                                    قوانین و شرایط استفاده را می‌پذیرم.
                                </span>

                            </label>

                        </div>


                        <div class="col-12">

                            <button
                                type="submit"
                                class="btn btn-dark-custom w-100"
                            >
                                ایجاد حساب
                                <i class="bx bx-user-plus"></i>
                            </button>

                        </div>

                    </div>


                    <p class="auth-switch">

                        قبلاً حساب ساخته‌اید؟

                        <a href="login.html">
                            ورود به حساب
                        </a>

                    </p>

                </form>

            </div>

        </div>

    </div>

</main>


<footer id="footer"></footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assests/js/script.js"></script>

</body>
</html>
