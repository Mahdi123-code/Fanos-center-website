<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود | فانوس</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../assests/css/style.css">

</head>

<body class="auth-page">

<header id="navbar"></header>


<main class="auth-section">

    <div class="container">

        <div class="auth-wrapper">


            <div class="auth-content">

                <div class="auth-logo">
                    <img
                            src="../assests/images/logo.jpg"
                            alt="مجتمع علمی فرهنگی فانوس"
                        />
                </div>

                <span class="section-eyebrow">
                    خوش آمدید
                </span>

                <h1>
                    ورود به حساب کاربری
                </h1>

                <p>
                    برای دسترسی به امکانات فانوس وارد حساب خود شوید.
                </p>


                <form class="auth-form">

                    <label for="email">
                        ایمیل
                    </label>

                    <div class="input-wrapper">

                        <i class="bx bx-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="ایمیل شما"
                            required
                        >

                    </div>


                    <label for="password">
                        رمز عبور
                    </label>

                    <div class="input-wrapper">

                        <i class="bx bx-lock-alt"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="رمز عبور"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                        >
                            <i class="bx bx-show"></i>
                        </button>

                    </div>


                    <div class="auth-options">

                        <label>
                            <input type="checkbox">
                            مرا به خاطر بسپار
                        </label>

                        <a href="#">
                            رمز عبور را فراموش کرده‌اید؟
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-dark-custom w-100"
                    >
                        ورود
                        <i class="bx bx-log-in"></i>
                    </button>


                    <p class="auth-switch">

                        حساب ندارید؟

                        <a href="register.html">
                            ایجاد حساب
                        </a>

                    </p>

                </form>

            </div>

        </div>

    </div>

</main>


<footer id="footer"></footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assests/js/script.js"></script>

</body>
</html>
